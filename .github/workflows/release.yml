name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test ./... -count=1

      - name: Validate semver tag
        run: |
          if ! echo "${{ github.ref_name }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '${{ github.ref_name }}' is not valid semver"
            exit 1
          fi

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        run: |
          VERSION=${{ github.ref_name }}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/local-mind-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/local-mind-linux-arm64 .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/local-mind-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/local-mind-darwin-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/local-mind-windows-amd64.exe .

      - name: Generate checksums
        run: cd bin && sha256sum local-mind-* > checksums.txt

      - name: Sign checksums (optional)
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          set -euo pipefail
          echo "$SIGNING_KEY" | base64 -d > /tmp/signing.pem
          openssl pkey -in /tmp/signing.pem -noout
          openssl pkeyutl -sign -inkey /tmp/signing.pem -rawin -in bin/checksums.txt \
            | xxd -p -c 256 | tr -d '\n' > bin/checksums.txt.sig
          rm /tmp/signing.pem
          [ -s bin/checksums.txt.sig ] || { echo "ERROR: signature is empty"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            bin/local-mind-linux-amd64
            bin/local-mind-linux-arm64
            bin/local-mind-darwin-amd64
            bin/local-mind-darwin-arm64
            bin/local-mind-windows-amd64.exe
            bin/checksums.txt
            bin/checksums.txt.sig

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/local-mind-*
